<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile | CATHS-MAIN</title>
<link rel="icon" type="image/png" href="sslg-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--blue:#3c9aff;--blue-bright:#77c4ff;--dark:#03152f;--glass:rgba(255,255,255,.10);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
html,body{min-height:100%;background:#03152f}
body{min-height:100vh;color:#fff;background:radial-gradient(900px 600px at 8% 8%,rgba(0,120,255,.28),transparent 60%),radial-gradient(800px 560px at 92% 14%,rgba(60,154,255,.14),transparent 58%),radial-gradient(700px 500px at 78% 92%,rgba(0,77,190,.24),transparent 62%),linear-gradient(135deg,#03152f 0%,#062b68 34%,#0a4ca2 66%,#173b78 100%);background-attachment:fixed;padding-bottom:95px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 20% 25%,rgba(100,180,255,.10) 0 1px,transparent 1.5px),radial-gradient(circle at 78% 72%,rgba(119,196,255,.08) 0 1px,transparent 1.5px);background-size:180px 180px,240px 240px;opacity:.5}
body::after{content:"";position:fixed;inset:-15%;pointer-events:none;z-index:-1;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.035) 48%,transparent 60%);transform:rotate(-4deg);opacity:.7}
.header{position:sticky;top:0;z-index:20;padding:12px 20px;display:grid;grid-template-columns:220px 1fr 220px;align-items:center;gap:15px;background:rgba(3,21,47,.42);border-bottom:1px solid rgba(119,196,255,.12);backdrop-filter:blur(20px) saturate(135%);-webkit-backdrop-filter:blur(20px) saturate(135%);box-shadow:0 8px 28px rgba(0,0,0,.10)}
.logo-group{display:flex;align-items:center;gap:8px}.logo,.caths-logo{width:54px;height:54px;object-fit:contain;display:block}.header-center{text-align:center;padding:0 10px}.header-center h1{font-size:18px;font-weight:700}.header-center p{font-size:11px;opacity:.82;margin-top:2px}.header-spacer{width:100%}
.container{max-width:980px;margin:0 auto;padding:26px 18px}
.profile-card{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.25)}
.cover{height:205px;background:linear-gradient(135deg,#031d45 0%,#064c9e 52%,#187bd2 100%);position:relative;overflow:hidden}.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(119,196,255,.28),transparent 38%),linear-gradient(120deg,transparent 25%,rgba(255,255,255,.07) 50%,transparent 72%)}
.profile-main{padding:0 32px 32px}.avatar-wrap{position:relative;margin-top:-68px;width:136px;height:136px;border-radius:50%;border:6px solid rgba(255,255,255,.95);background:#dfe7f5;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.30),0 0 0 1px rgba(119,196,255,.20)}.avatar-wrap img{width:100%;height:100%;object-fit:cover}.fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px;color:#285b9f}
.name{font-size:30px;font-weight:800;margin-top:16px;letter-spacing:-.3px}.username{font-size:13px;color:rgba(255,255,255,.72);margin-top:2px}.email{font-size:12px;color:rgba(255,255,255,.60);margin-top:5px}.bio{margin-top:15px;line-height:1.75;font-size:14px;max-width:720px;color:rgba(255,255,255,.90)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chip{padding:7px 11px;border-radius:999px;background:rgba(60,154,255,.13);border:1px solid rgba(119,196,255,.18);font-size:11px;color:#eaf6ff}
.actions{display:flex;gap:10px;margin-top:22px}.back-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#1678d4,#3c9aff);color:#fff;padding:11px 18px;border:1px solid rgba(255,255,255,.14);border-radius:13px;font-weight:800;font-size:13px;box-shadow:0 8px 22px rgba(20,120,255,.20);transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}.back-btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 12px 28px rgba(20,120,255,.28)}
.status{margin-top:18px;padding:12px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);font-size:12px;text-align:center;color:rgba(255,255,255,.76)}
.bottom-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:75px!important;min-height:75px!important;margin:0!important;padding:4px 10px calc(4px + env(safe-area-inset-bottom))!important;display:flex!important;align-items:center!important;justify-content:space-around!important;gap:0!important;border-top:1px solid rgba(255,255,255,.12)!important;border-radius:0!important;background:rgba(0,0,0,.28)!important;-webkit-backdrop-filter:blur(20px) saturate(135%)!important;backdrop-filter:blur(20px) saturate(135%)!important;box-shadow:0 -10px 28px rgba(0,0,0,.14)!important;z-index:2147483000!important;overflow:visible!important}
.bottom-nav::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent 2%,rgba(119,196,255,.10) 18%,rgba(119,196,255,.36) 50%,rgba(119,196,255,.10) 82%,transparent 98%)}
.nav-item{position:relative;flex:1 1 0;max-width:190px;height:61px;margin:0;padding:5px 8px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;white-space:nowrap;color:rgba(255,255,255,.78);font:600 11px/1.1 Poppins,Arial,sans-serif;text-decoration:none;transition:color .25s ease,transform .28s cubic-bezier(.22,1,.36,1),background .25s ease,text-shadow .25s ease}.nav-item div{width:30px;height:28px;display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;color:currentColor;margin:0}.nav-item:hover{color:#fff;transform:translateY(-2px);background:rgba(255,255,255,.035)}.nav-item:active{transform:translateY(-1px) scale(.97)}.nav-item.active{color:#fff;transform:translateY(-4px) scale(1.035);text-shadow:0 0 12px rgba(119,196,255,.16)}.nav-item.active div{font-size:26px;transform:translateY(-1px)}.nav-item.active::after{content:"";position:absolute;left:50%;bottom:3px;width:24px;height:3px;transform:translateX(-50%);border-radius:999px;background:#77c4ff;box-shadow:0 0 13px rgba(119,196,255,.72)}
@media(max-width:768px){.header{padding:9px 10px;grid-template-columns:105px 1fr 105px}.logo,.caths-logo{width:42px;height:42px}.header-center h1{font-size:13px}.header-center p{font-size:8px}.container{padding:15px 12px}.cover{height:145px}.profile-main{padding:0 19px 23px}.avatar-wrap{width:108px;height:108px;margin-top:-54px}.name{font-size:23px}.bio{font-size:12px}.bottom-nav{height:75px;min-height:75px;padding:4px 4px calc(4px + env(safe-area-inset-bottom))!important}.nav-item{height:61px;padding:5px 3px;border-radius:13px;font-size:10px}.nav-item div{width:27px;height:26px;font-size:21px}.nav-item.active div{font-size:24px}}
@media(max-width:420px){.bottom-nav{height:70px;min-height:70px}.nav-item{height:55px;font-size:9.5px}.nav-item div{font-size:19px}.nav-item.active div{font-size:22px}}
@media(prefers-reduced-motion:reduce){.back-btn,.nav-item{transition:none}}
</style>
</head>
<body>
<header class="header">
  <div class="logo-group"><img src="sslg-logo.png" class="logo" alt="SSLG"><img src="caths-logo.png" class="caths-logo" alt="CATHS"></div>
  <div class="header-center"><h1>CATHS-MAIN Student Profile</h1><p>School Community Profile</p></div>
  <div class="header-spacer"></div>
</header>
<main class="container">
  <div class="profile-card">
    <div class="cover"></div>
    <section class="profile-main">
      <div class="avatar-wrap"><img id="avatar" style="display:none" alt="Profile photo"><div id="fallback" class="fallback">👤</div></div>
      <h2 id="name" class="name">Loading...</h2>
      <div id="username" class="username"></div>
      <div id="email" class="email"></div>
      <div id="bio" class="bio">Loading profile...</div>
      <div class="chips"><span id="sectionChip" class="chip" style="display:none"></span><span class="chip">🎓 CATHS-MAIN Student</span></div>
      <div class="actions"><a class="back-btn" href="friends.html">← Back to Friends</a></div>
      <div id="status" class="status">Loading profile...</div>
    </section>
  </div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><div>🏠</div><span>Home</span></a>
  <a href="news.html" class="nav-item"><div>📢</div><span>News</span></a>
  <a href="voice.html" class="nav-item"><div>🗣️</div><span>Student Voice</span></a>
  <a href="friends.html" class="nav-item active"><div>👥</div><span>Friends</span></a>
  <a href="profile.html" class="nav-item"><div>👤</div><span>Profile</span></a>
</nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB2Jmyc1qzDtrgbgbE_jOmSVz604YHLbDc",authDomain:"caths-page.firebaseapp.com",projectId:"caths-page",storageBucket:"caths-page.firebasestorage.app",messagingSenderId:"945498022620",appId:"1:945498022620:web:71aeb4cd2472e061aeca19",measurementId:"G-CBG1YSK13G"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id); const params=new URLSearchParams(location.search); const uid=params.get('uid');
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));}
async function load(){
  if(!uid){$('status').textContent='No profile was selected.';return;}
  try{
    const snap=await getDoc(doc(db,'users',uid));
    if(!snap.exists()){ $('name').textContent='Profile not found'; $('bio').textContent='This student profile is no longer available.'; $('status').textContent='Profile unavailable.'; return; }
    const d=snap.data()||{};
    $('name').textContent=d.name||d.nickname||d.displayName||'Student';
    $('username').textContent=d.username?`@${d.username}`:'';
    $('email').textContent='';
    $('bio').textContent=d.bio||'No bio yet.';
    if(d.section){$('sectionChip').style.display='inline-flex';$('sectionChip').textContent=`📚 ${d.section}`;}
    if(d.photoURL){$('avatar').src=d.photoURL;$('avatar').style.display='block';$('fallback').style.display='none';}
    $('status').textContent='Profile loaded successfully.';
  }catch(e){console.error(e);$('name').textContent='Unable to load profile';$('bio').textContent='Please check your Firebase Firestore rules.';$('status').textContent='Could not load this profile.';}
}
onAuthStateChanged(auth,user=>{ if(!user){ location.href='profile.html'; return; } load(); });
</script>
</body>
</html>
