<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATHS-MAIN Student Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:linear-gradient(135deg,#00296B,#003DA5,#FFD700);min-height:100vh;color:#fff;padding-bottom:100px}
.container{max-width:900px;margin:auto;padding:20px}
.voice-card{background:rgba(255,255,255,.12);backdrop-filter:blur(15px);padding:25px;border-radius:25px}
input,select,textarea{width:100%;padding:15px;border:none;border-radius:15px;margin-bottom:15px}
textarea{height:150px}
.checkbox{display:flex;align-items:center;gap:10px;margin:15px 0}
.checkbox input{width:auto}
.submit-btn,.view-btn{width:100%;height:70px;border:none;border-radius:20px;font-size:20px;font-weight:700;cursor:pointer}
.submit-btn{background:#FFD700;color:#00296B;margin-bottom:12px}
.view-btn{background:#fff;color:#00296B}
.popup,.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999}
.popup{justify-content:center;align-items:center}
.popup-content,.modal-content{background:#fff;color:#222;border-radius:20px;padding:25px}
.popup-content{max-width:350px;width:90%;text-align:center}
.modal-content{width:90%;max-width:850px;max-height:80vh;overflow:auto;margin:5% auto}
.close{float:right;font-size:35px;cursor:pointer;color:#183c8c}
.concern-card{background:#fff;border-left:5px solid #2f4fa2;padding:15px;border-radius:15px;margin:10px 0;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.1)}
</style>
</head>
<body>

<div class="container">
<div class="voice-card">
<h2>🗣️ Submit a Concern or Suggestion</h2>
<form id="voiceForm">
<input type="text" id="name" placeholder="Enter your name" required>

<div class="checkbox">
<input type="checkbox" id="anonymous">
<label for="anonymous">Submit Anonymously</label>
</div>

<input type="text" id="section" placeholder="Example: 11-Twain" required>

<select id="category" required>
<option value="">Select Category</option>
<option>Facilities</option>
<option>Academics</option>
<option>Bullying</option>
<option>Guidance Concern</option>
<option>School Event</option>
<option>SSLG Suggestion</option>
<option>Others</option>
</select>

<textarea id="concern" placeholder="Type your concern..." required></textarea>

<button type="submit" class="submit-btn">Submit Concern</button>
<button type="button" onclick="openConcerns()" class="view-btn">📥 View Concerns</button>
</form>
</div>
</div>

<div id="successPopup" class="popup">
<div class="popup-content">
<h2>✅ Thank You!</h2>
<p>Your concern has been submitted successfully.</p>
<button onclick="closePopup()">OK</button>
</div>
</div>

<div id="concernsModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeConcerns()">&times;</span>
<h2>📥 Student Concerns</h2>
<div id="concernsList">Loading concerns...</div>
</div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz0BU6Qgp3nUL7zRlRjuzVoJoWbzxYIiG3vL0AvKuwWN2F3srViP3AImFcvUytjhCQQ/exec";

const anonymous=document.getElementById("anonymous");
const nameInput=document.getElementById("name");

anonymous.addEventListener("change",()=>{
 if(anonymous.checked){nameInput.value="Anonymous";nameInput.readOnly=true;}
 else {nameInput.value="";nameInput.readOnly=false;}
});

document.getElementById("voiceForm").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const data={
  name: anonymous.checked?"Anonymous":nameInput.value,
  section: document.getElementById("section").value,
  concern: "["+document.getElementById("category").value+"] "+document.getElementById("concern").value
 };

 try{
   await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(data)});
   document.getElementById("successPopup").style.display="flex";
   document.getElementById("voiceForm").reset();
 }catch(err){alert("Failed to submit.");}
});

function closePopup(){
 document.getElementById("successPopup").style.display="none";
}

async function openConcerns(){
 document.getElementById("concernsModal").style.display="block";
 try{
   const res=await fetch(SCRIPT_URL);
   const data=await res.json();
   let html="";
   data.reverse().forEach(item=>{
     html+=`<div class="concern-card">
       <h3>👤 ${item.name}</h3>
       <p><b>Section:</b> ${item.section}</p>
       <p><b>Concern:</b> ${item.concern}</p>
       <small>📌 Status: ${item.status}</small>
     </div>`;
   });
   document.getElementById("concernsList").innerHTML=html||"No concerns yet.";
 }catch(e){
   document.getElementById("concernsList").innerHTML="Failed to load concerns.";
 }
}

function closeConcerns(){
 document.getElementById("concernsModal").style.display="none";
}
</script>
</body>
</html>
